server {
    listen 80;
    server_name mentis.kassiosousa.com.br;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Resolve the php upstream via Docker's embedded DNS (avoids startup crash).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Long-cache the hashed Vite assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Laravel API + healthcheck + Swagger docs/assets -> php-fpm (single front controller)
    location ~ ^/(api|up|docs) {
        set $upstream_php php:9000;
        include fastcgi_params;
        fastcgi_pass $upstream_php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # React SPA — client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
